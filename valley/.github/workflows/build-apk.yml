name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Скачать Three.js в vendor (чтобы игра работала офлайн)
        run: |
          mkdir -p vendor
          curl -sL https://unpkg.com/three@0.152.2/build/three.min.js -o vendor/three.min.js

      - name: Собрать веб-папку
        run: |
          mkdir -p dist
          cp -r index.html css js vendor dist/

      - name: Настроить Capacitor
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx --yes cap init "Долина Тихого Ветра" com.quietwind.valley --web-dir=dist
          npx --yes cap add android

      - name: Синхронизировать веб в Android
        run: npx cap sync android

      - name: Собрать APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk valley-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: valley-debug.apk
